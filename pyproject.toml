[build-system]
requires = ["setuptools>=61.0", "wheel", "django>=2.0.5"]
build-backend = "setuptools.build_meta"

[project]
name = "snowland-djangohelper"
dynamic = ["version"]
description = "django helper, toolkit for django."
readme = "README.md"
requires-python = ">=3.6"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "A.Star", email = "astar@snowland.ltd" },
]
maintainers = [
    { name = "A.Star", email = "astar@snowland.ltd" },
]
urls = { Home = "https://gitee.com/snowlandltd/snowland-djangohelper" }
dependencies = [
    "django>=2.0.5",
    "djangorestframework>=3.11.1",
    "snowland-smx>=1.0",
    "snowland-authsdk>=0.2",
    "requests",
]

[project.optional-dependencies]
bcrypt = ["bcrypt"]

[tool.setuptools]
packages = { find = {} }

[tool.setuptools.package-data]
djangohelper = ["templetes/*.html"]

[tool.setuptools.dynamic]
# ``version`` 从包内属性动态导入，避免与 `djangohelper/__init__.py` 的 VERSION 重复维护、产生不一致。
version = { attr = "djangohelper.__version__" }
